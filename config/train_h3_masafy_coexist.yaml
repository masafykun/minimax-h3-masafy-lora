---
job: extension
config:
  name: masafy_h3_ref2va_lora_coexist_10step
  process:
    - type: diffusion_trainer
      training_folder: /workspace/masafy-h3-lora/output
      sqlite_db_path: /workspace/masafy-h3-lora/records/aitk-coexist.db
      device: cuda:0
      trigger_word: null
      performance_log_every: 2

      network:
        type: lora
        linear: 16
        linear_alpha: 16
        network_kwargs:
          ignore_if_contains:
            - adaln_proj

      save:
        dtype: bf16
        save_every: 5
        max_step_saves_to_keep: 2
        save_format: safetensors
        push_to_hub: false

      datasets:
        - folder_path: /workspace/masafy-h3-lora/dataset/train
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          is_reg: false
          network_weight: 1
          resolution: [512]
          shrink_video_to_frames: true
          num_frames: 1
          flip_x: false
          flip_y: false
          num_repeats: 1
          do_i2v: false
          do_audio: false
          auto_frame_count: false
          fps: 24

      train:
        batch_size: 1
        steps: 10
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        timestep_type: shift
        content_or_style: balanced
        optimizer_params:
          weight_decay: 0.0001
        unload_text_encoder: false
        cache_text_embeddings: true
        lr: 0.0001
        skip_first_sample: true
        disable_sampling: true
        dtype: bf16
        loss_type: mse
        audio_loss_multiplier: 1.0

      logging:
        log_every: 1
        use_ui_logger: true

      model:
        name_or_path: Comfy-Org/MiniMax-H3
        arch: minimax_h3
        quantize: true
        qtype: convrot8
        quantize_te: true
        qtype_te: nvfp4
        low_vram: true
        layer_offloading: true
        layer_offloading_transformer_percent: 1.0
        assistant_lora_path: ostris/minimax_h3_training_adapter/minimax_h3_training_adapter_alpha.safetensors
        model_kwargs:
          partition: ref2va_pruned

      sample:
        sampler: flowmatch
        sample_every: 10
        sample_start_step: 10
        width: 512
        height: 512
        samples:
          - prompt: masafy_character, a cute anthropomorphic red panda wearing brown aviator goggles and a pink patterned scarf, standing in a simple park, clean character illustration
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 1
        sample_steps: 28
        num_frames: 1
        fps: 24

meta:
  name: "[name]"
  version: "0.1-coexist"
